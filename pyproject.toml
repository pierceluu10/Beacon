[project]
name = "beacon"
version = "0.1.0"
description = "A voice assistant that uses your computer: say its name or hold a key, speak, and watch it work."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic==2.11.0",
    "httpx2==2.16.2",
    "mcp==2.3.0",
    "moonshine-voice==0.1.6",
    "pyobjc-framework-applicationservices>=13.0",
    "pyobjc-framework-quartz>=13.0",
    "sounddevice==0.5.6",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
addopts = "-v -ra"
